function pq(k){const t=td();M=k=='tm'?t.slice(0,7):k=='lm'?pm0(t.slice(0,7)):k=='ty'?t.slice(0,4):dsh(t,k=='d30'?-29:-89)+'..'+t;PS=0;V()}
function pr(){const a=$('#rf').value,b=$('#rt').value;if(!a||!b||b<a){$('#pe').textContent='Isi kedua tanggal; tanggal akhir tidak boleh sebelum awal.';return}M=a+'..'+b;PS=0;V()}
function mpx(){return `<div class="row top"><b class="logo">SakuScope</b><div class="pp"><button class="l" onclick="stp(-1)" aria-label="Periode sebelumnya">\u2039</button><button class="chip" onclick="PS=1;V()">${ML(M)} \u25be</button><button class="l" onclick="stp(1)" aria-label="Periode berikutnya">\u203a</button></div></div>${PS?psheet():''}`}
function psheet(){const y1=new Date().getFullYear(),y0=Math.min(y1,...S.t.map(t=>+String(t.d).slice(0,4)).filter(Boolean)),ys=[];for(let y=y1;y>=y0;y--)ys.push(y);
return `<div class="bk" onclick="PS=0;V()"></div><div class="sh"><b class="sht">Pilih periode</b><div class="qk">${[['Bulan ini','tm'],['Bulan lalu','lm'],['Tahun ini','ty'],['30 hari terakhir','d30'],['90 hari terakhir','d90']].map(x=>`<button class="pill" onclick="pq('${x[1]}')">${x[0]}</button>`).join('')}</div><div class="f" style="margin-top:14px"><label><small>Bulan tertentu</small><input type="month" value="${BM()}" onchange="if(this.value){M=this.value;PS=0;V()}"></label><label><small>Satu tahun</small><select onchange="if(this.value){M=this.value;PS=0;V()}"><option value="" disabled ${M.length!=4?'selected':''}>Pilih tahun</option>${ys.map(y=>`<option ${M==y?'selected':''}>${y}</option>`).join('')}</select></label><label><small>Dari tanggal</small><input id="rf" type="date"></label><label><small>Sampai tanggal</small><input id="rt" type="date"></label></div><div class="row" style="margin-top:12px"><span class="rd" id="pe"></span><button class="b" onclick="pr()">Pakai rentang</button></div></div>`}
let bo=0,_tt;
function sbc(el){S.bud[el.dataset.c]=+el.value||0;bo=1;save();V()}
function toast(m,lb,fn){const t=$('#ts');t.innerHTML=`<span>${e(m)}</span>${lb?'<button class="l" id="tu" style="color:#7ee0c4">'+lb+'</button>':''}`;if(lb)$('#tu').onclick=()=>{fn();t.innerHTML=''};clearTimeout(_tt);_tt=setTimeout(()=>t.innerHTML='',6000)}
const nms=()=>{const c={};S.t.forEach(t=>{if(t.ty!='tf')c[t.n]=(c[t.n]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,80).map(x=>`<option value="${e(x[0])}">`).join('')};
function af(v){if(ed!='new')return;const k=nn(v),t=S.t.filter(x=>nn(x.n)==k&&x.ty!='tf').sort((a,b)=>a.d<b.d?1:-1)[0];if(!t)return;$('#fy').value=t.ty;if(S.c.includes(t.c))$('#fc').value=t.c;if(S.w.some(w=>w.id==t.w))$('#fw').value=t.w;if(!$('#fa').value)$('#fa').value=t.a}
const csvOf=l=>'tanggal,jenis,nama,nominal,kategori,dompet,dompet_tujuan,catatan\n'+l.map(t=>[t.d,t.ty,q(t.n),t.a,q(t.c),q(wn(t.w)),q(wn(t.w2)),q(t.note)].join(',')).join('\n');
function dl(p){const l=p?inM(M):S.t;if(!l.length)return toast('Tidak ada transaksi untuk diunduh');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csvOf(l)],{type:'text/csv'}));a.download='sakuscope-'+(p?'periode':'semua')+'-'+td()+'.csv';document.body.appendChild(a);a.click();a.remove();toast(l.length+' transaksi diunduh')}
let RF=0;
function aw(){const n=$('#nw').value.trim();if(n){S.w.push({id:Date.now(),n,b:0});save();V()}}
function rnw(id){const w=S.w.find(x=>x.id==id),n=prompt('Nama dompet',w.n);if(n&&n.trim()){w.n=n.trim();save();V()}}
function dw(id){if(S.w.length<2)return toast('Minimal harus ada satu dompet');const w=S.w.find(x=>x.id==id);S.w=S.w.filter(x=>x.id!=id);save();V();toast('Dompet dihapus','Urungkan',()=>{S.w.push(w);save();V()})}
function ac(){const n=$('#nc').value.trim();if(n&&!S.c.includes(n)){S.c.push(n);save();V()}}
function dc(c){S.c=S.c.filter(x=>x!=c);delete S.bud[c];save();V()}
function clr(b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Ketuk lagi untuk konfirmasi';return}try{localStorage.removeItem(K)}catch(x){}location.reload()}
function delr(id){const r=S.rc.find(x=>x.id==id);S.rc=S.rc.filter(x=>x.id!=id);save();V();toast('Jadwal dihapus','Urungkan',()=>{S.rc.push(r);save();V()})}
function rform(){return `<div class="bk" onclick="RF=0;V()"></div><div class="sh"><b class="sht">Tambah jadwal</b><div class="f"><input id="rn" placeholder="Nama (mis. Netflix)"><input id="ra" type="number" inputmode="numeric" placeholder="Nominal"><select id="rcat">${S.c.map(c=>`<option>${e(c)}</option>`).join('')}</select><select id="rw">${S.w.map(w=>`<option value="${w.id}">${e(w.n)}</option>`).join('')}</select><select id="rf"><option value="m">Bulanan</option><option value="w">Mingguan</option><option value="y">Tahunan</option></select><label><small>Mulai</small><input id="rs" type="date" value="${td()}"></label><label style="grid-column:span 2"><small>Berakhir (opsional)</small><input id="re" type="date"></label></div><div class="row" style="margin-top:12px"><span class="rd">${msg}</span><span><button class="l" onclick="RF=0;msg='';V()">Batal</button> <button class="b" onclick="ar()">Simpan</button></span></div></div>`}
let KC=null;
const nct=c=>S.t.filter(t=>t.c==c).length+S.rc.filter(r=>r.c==c).length;
function wal(){return wal0()+(KC!=null?kform():'')}
function kform(){const c=KC,n=nct(c),oth=S.c.filter(x=>x!=c);
return `<div class="bk" onclick="KC=null;msg='';V()"></div><div class="sh"><b class="sht">${e(c)}</b><small>${n} transaksi/jadwal memakai kategori ini.</small>
<b style="display:block;margin:14px 0 6px;font-size:14px">Ubah nama</b><div class="row"><input id="kn" value="${e(c)}" style="flex:1"><button class="b" onclick="krn()">Simpan</button></div>
${oth.length?`<b style="display:block;margin:16px 0 6px;font-size:14px">Gabung ke kategori lain</b><div class="row"><select id="kg" style="flex:1">${oth.map(x=>`<option>${e(x)}</option>`).join('')}</select><button class="b" onclick="kmg()">Gabung</button></div><small>Semua transaksi, jadwal, dan anggarannya dipindah, lalu \u201c${e(c)}\u201d dihapus.</small>`:''}
<div class="row" style="margin-top:14px"><span class="rd">${msg}</span><span>${n?'':'<button class="l rd" onclick="kdl()">Hapus</button>'}<button class="l" onclick="KC=null;msg=\'\';V()">Tutup</button></span></div></div>`}
function kmove(a,b){const n=nct(a),snap=JSON.stringify({c:S.c,t:S.t,rc:S.rc,bud:S.bud,lc:S.lc}),merged=S.c.includes(b);
S.t.forEach(t=>{if(t.c==a)t.c=b});S.rc.forEach(r=>{if(r.c==a)r.c=b});
if(S.bud[a]!=null){S.bud[b]=(S.bud[b]||0)+S.bud[a];delete S.bud[a]}
if(S.lc==a)S.lc=b;const i=S.c.indexOf(a);S.c=S.c.filter(x=>x!=a);if(!S.c.includes(b))S.c.splice(i,0,b);
KC=null;msg='';save();V();toast(merged?`\u201c${a}\u201d digabung ke \u201c${b}\u201d (${n} data dipindah)`:`Diubah jadi \u201c${b}\u201d (${n} data ikut diperbarui)`,'Urungkan',()=>{const o=JSON.parse(snap);S.c=o.c;S.t=o.t;S.rc=o.rc;S.bud=o.bud;S.lc=o.lc;save();V()})}
function krn(){const a=KC,b=$('#kn').value.trim();if(!b||b==a){KC=null;return V()}if(b=='Transfer'||b=='_all'){msg='Nama itu dipakai sistem';return V()}kmove(a,b)}
function kmg(){kmove(KC,$('#kg').value)}
function kdl(){S.c=S.c.filter(x=>x!=KC);delete S.bud[KC];KC=null;save();V()}
boot();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
