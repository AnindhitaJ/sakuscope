<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f766e"><title>SakuScope</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>

</style></head><body><div id="app"></div>
<nav id="nv"></nav>
<script>
const K='saku1';let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
if(!S)S={w:[{id:1,n:'Cash',b:0},{id:2,n:'Bank',b:0}],c:['Food & Beverage','Transportation','Shopping','Bills & Utilities','Entertainment','Health','Housing','Education','Others','Gaji'],t:[],bud:{},th:25000};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}clearTimeout(window._p);window._p=setTimeout(()=>push(),600)};S.rc=S.rc||[];let Z=6;
let tab='dash',M=new Date().toISOString().slice(0,7),F={q:'',ty:'',c:'',n:'',all:0},ed=null,msg='';
const $=s=>document.querySelector(s),R=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID'),
e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
pm=m=>{let[y,n]=m.split('-').map(Number);n--;if(!n){n=12;y--}return y+'-'+String(n).padStart(2,'0')},
sum=a=>a.reduce((s,t)=>s+t.a,0),nn=s=>s.trim().toLowerCase().replace(/\s+/g,' '),
inM=m=>S.t.filter(t=>t.d.slice(0,7)==m),ex=m=>inM(m).filter(t=>t.ty=='ex'),inc=m=>inM(m).filter(t=>t.ty=='in'),
pc=(a,b)=>b?Math.round((a-b)/b*100):null,
wb=w=>S.t.reduce((s,t)=>s+(t.ty=='in'&&t.w==w.id?t.a:t.ty=='ex'&&t.w==w.id?-t.a:t.ty=='tf'?(t.w==w.id?-t.a:0)+(t.w2==w.id?t.a:0):0),+w.b),
grp=(a,f)=>{const m={};a.forEach(t=>{const k=f(t),g=m[k]||(m[k]={k,tot:0,n:0,max:0,names:{}});g.tot+=t.a;g.n++;g.max=Math.max(g.max,t.a);g.names[t.n]=(g.names[t.n]||0)+1});return Object.values(m).sort((a,b)=>b.tot-a.tot)};
const mp=()=>`<div class="row"><b style="font-size:20px">SakuScope</b><input type="month" value="${M}" onchange="M=this.value||M;V()"></div>`;
function go(t,f){tab=t;if(f)F=Object.assign({q:'',ty:'',c:'',n:'',all:0},f);V();scrollTo(0,0)}
function dash(){const i=sum(inc(M)),x=sum(ex(M)),px=sum(ex(pm(M))),b=S.bud._all||0,ms=[];let m=M;for(let k=0;k<6;k++){ms.unshift(m);m=pm(m)}
const d=ms.map(m=>[m,sum(inc(m)),sum(ex(m))]),mx=Math.max(1,...d.map(a=>Math.max(a[1],a[2])));
return mp()+`<div class="g" style="margin-top:10px"><div class="c"><small>Pemasukan</small><b class="gn">${R(i)}</b></div><div class="c"><small>Pengeluaran</small><b class="rd">${R(x)}</b></div><div class="c"><small>Selisih</small><b>${R(i-x)}</b></div><div class="c"><small>Pengeluaran / pemasukan</small><b>${i?Math.round(x/i*100)+'%':'–'}</b></div><div class="c"><small>vs bulan lalu</small><b>${px?pc(x,px)+'%':'–'}</b></div><div class="c"><small>Sisa anggaran</small><b>${b?R(b-x):'Belum diatur'}</b></div></div>
<h2>Pemasukan vs pengeluaran (6 bulan)</h2><div class="c"><div class="ch">${d.map(a=>`<div><span><i style="height:${a[1]/mx*100}%;background:var(--gn)"></i><i style="height:${a[2]/mx*100}%;background:var(--rd)"></i></span>${a[0].slice(2)}</div>`).join('')}</div><div class="tw"><table><tr><th>Bulan</th><th>Masuk</th><th>Keluar</th></tr>${d.map(a=>`<tr><td>${a[0]}</td><td>${R(a[1])}</td><td>${R(a[2])}</td></tr>`).join('')}</table></div></div>
${due()}<h2>Total saldo: ${R(S.w.reduce((s,w)=>s+wb(w),0))}</h2>${S.t.length?'':'<div class="c">Belum ada transaksi. Tambah di tab Transaksi, atau coba <button class="l" onclick="demo()">isi data contoh</button>.</div>'}`}
function tx(){let l=S.t.filter(t=>(F.all||t.d.slice(0,7)==M)&&(!F.ty||t.ty==F.ty)&&(!F.c||t.c==F.c)&&(!F.n||nn(t.n)==F.n)&&(!F.q||nn(t.n+' '+(t.note||'')).includes(nn(F.q)))).sort((a,b)=>b.d<a.d?-1:1);
const o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${e(x)}</option>`).join(''),E=ed&&ed!='new'?S.t.find(t=>t.id==ed):{},
wo=v=>S.w.map(w=>`<option value="${w.id}" ${w.id==v?'selected':''}>${e(w.n)}</option>`).join('');
const form=ed?`<div class="c"><div class="f"><select id="fy" onchange="$('#fw2').style.display=this.value=='tf'?'':'none'"><option value="ex" ${E.ty=='ex'?'selected':''}>Pengeluaran</option><option value="in" ${E.ty=='in'?'selected':''}>Pemasukan</option><option value="tf" ${E.ty=='tf'?'selected':''}>Transfer</option></select><input id="fd" type="date" value="${E.d||new Date().toISOString().slice(0,10)}"><input id="fn" placeholder="Nama (mis. GrabFood)" value="${e(E.n)}"><input id="fa" type="number" min="0" placeholder="Nominal" value="${E.a||''}"><select id="fc">${o(S.c,E.c)}</select><select id="fw">${wo(E.w)}</select><select id="fw2" style="display:${E.ty=='tf'?'':'none'}">${wo(E.w2)}</select><input id="fo" placeholder="Catatan" value="${e(E.note)}"></div><div class="row" style="margin-top:8px"><span class="rd">${msg}</span><span><button class="l" onclick="ed=null;msg='';V()">Batal</button> <button class="b" onclick="sv()">Simpan</button></span></div></div>`:'';
return mp()+`<div class="row" style="margin:10px 0"><h2 style="margin:0">Transaksi</h2><button class="b" onclick="ed='new';V()">+ Tambah</button></div>${form}
<div class="f"><input placeholder="Cari…" value="${e(F.q)}" oninput="F.q=this.value;V(1)"><select onchange="F.ty=this.value;V()"><option value="">Semua tipe</option><option value="ex" ${F.ty=='ex'?'selected':''}>Pengeluaran</option><option value="in" ${F.ty=='in'?'selected':''}>Pemasukan</option><option value="tf" ${F.ty=='tf'?'selected':''}>Transfer</option></select></div>
<p><small>${F.c?'Kategori: '+e(F.c)+' · ':''}${F.n?'Nama: '+e(F.n)+' · ':''}<label><input type="checkbox" ${F.all?'checked':''} onchange="F.all=this.checked?1:0;V()"> semua bulan</label> ${F.c||F.n?'<button class="l" onclick="go(\'tx\')">hapus filter</button>':''} · ${l.length} transaksi · ${R(sum(l.filter(t=>t.ty=='ex')))} keluar</small></p>
${l.map(t=>`<div class="c row"><div><b>${e(t.n)}</b><br><small>${t.d} · ${e(t.c)} · ${e((S.w.find(w=>w.id==t.w)||{}).n)}${t.ty=='tf'?' → '+e((S.w.find(w=>w.id==t.w2)||{}).n):''}</small></div><div style="text-align:right" class="${t.ty=='in'?'gn':t.ty=='ex'?'rd':''}">${R(t.a)}<br><button class="l" onclick="ed=${t.id};scrollTo(0,0);V()">ubah</button><button class="l" onclick="del(${t.id})">hapus</button></div></div>`).join('')||'<div class="c mu">Tidak ada transaksi.</div>'}`}
function sv(){const a=+$('#fa').value,n=$('#fn').value.trim(),ty=$('#fy').value,w=+$('#fw').value,w2=+$('#fw2').value;
if(!(a>0)||!n){msg='Nama dan nominal wajib diisi';return V()}if(ty=='tf'&&w==w2){msg='Dompet asal dan tujuan harus berbeda';return V()}
const t={id:ed=='new'?Date.now():ed,d:$('#fd').value,n,a,ty,c:ty=='tf'?'Transfer':$('#fc').value,w,w2:ty=='tf'?w2:null,note:$('#fo').value};
if(ed=='new'){if(S.t.some(x=>x.d==t.d&&x.n==t.n&&x.a==t.a&&x.w==t.w)&&!msg.startsWith('Mirip')){msg='Mirip transaksi yang sudah ada. Tekan Simpan lagi jika memang berbeda.';return V()}S.t.push(t)}else S.t=S.t.map(x=>x.id==t.id?t:x);
ed=null;msg='';save();V()}
function del(id){S.t=S.t.filter(t=>t.id!=id);save();V()}
function bud(){const x=ex(M),ct=grp(x,t=>t.c),tot=sum(x),bar=(u,b)=>{const p=b?u/b*100:0;return `<div class="bar"><i class="${p>=100?'o':p>=80?'w':''}" style="width:${Math.min(100,p)}%"></i></div><small>${b?Math.round(p)+'% terpakai · '+(b>=u?'sisa '+R(b-u):'lebih '+R(u-b))+(p>=100?' ⚠ melebihi':p>=80?' ⚠ mendekati batas':''):'Belum ada anggaran'}</small>`};
return mp()+`<h2>Anggaran bulanan</h2><div class="c"><div class="row"><b>Total</b><input type="number" style="width:140px" value="${S.bud._all||''}" placeholder="Rp" onchange="S.bud._all=+this.value;save();V()"></div>${bar(tot,S.bud._all||0)}</div>
${S.c.filter(c=>c!='Gaji').map(c=>{const u=(ct.find(g=>g.k==c)||{tot:0}).tot;return `<div class="c"><div class="row"><b>${e(c)}</b><input type="number" style="width:140px" value="${S.bud[c]||''}" placeholder="Rp" onchange="S.bud['${c.replace(/'/g,"\\'")}']=+this.value;save();V()"></div><small>Terpakai ${R(u)}</small>${bar(u,S.bud[c]||0)}</div>`}).join('')}`}
function AN(m){const p=pm(m),cur=ex(m),prv=ex(p),tot=sum(cur),pt=sum(prv),hist=new Set(S.t.map(t=>t.d.slice(0,7))).size,gc=grp(cur,t=>t.c),gp=grp(prv,t=>t.c),gm=grp(cur,t=>nn(t.n)),gmp=grp(prv,t=>nn(t.n)),R_=[];
const cats=gc.map(g=>{const q=gp.find(x=>x.k==g.k)||{tot:0,n:0};return{...g,pt:q.tot,pn:q.n,df:g.tot-q.tot}});
if(hist<2)return{tot,pt,hist,cats,gm,gmp,R_,lim:1};
cats.filter(c=>c.pt>0&&c.df>0).sort((a,b)=>b.df-a.df).slice(0,3).forEach(c=>{const av=c.tot/c.n,dn=c.n-c.pn;R_.push({f:`${c.k} naik ${pc(c.tot,c.pt)}% (+${R(c.df)})`,d:`${c.n} transaksi (bulan lalu ${c.pn}), rata-rata ${R(av)}`,a:dn>0?`Batasi frekuensi kembali ke ${c.pn} transaksi/bulan`:`Periksa nominal per transaksi, bukan frekuensinya`,i:dn>0?`≈ ${R(dn*av)}/bulan (${dn} transaksi × rata-rata)`:`Maks. ${R(c.df)}/bulan jika kembali ke level lalu`,k:'Sedang: berdasar 2 bulan data',c:c.k})});
gm.filter(g=>g.n>=4).slice(0,2).forEach(g=>{const r=Math.max(1,Math.floor(g.n*.25)),nm=Object.keys(g.names)[0];R_.push({f:`${nm}: ${R(g.tot)} dalam ${g.n} transaksi`,d:`Rata-rata ${R(g.tot/g.n)} per transaksi`,a:`Kurangi ${r} transaksi per bulan (opsional)`,i:`≈ ${R(r*g.tot/g.n)}/bulan (${r} × rata-rata)`,k:'Rendah-sedang: nama dicocokkan persis, konteks tak diketahui',n:g.k})});
const m1=pm(m),m2=pm(m1);S.c.forEach(c=>{const v=[m2,m1,m].map(x=>sum(ex(x).filter(t=>t.c==c)));if(v[0]>0&&v[0]<v[1]&&v[1]<v[2])R_.push({f:`${c} naik 3 bulan berturut-turut`,d:`${R(v[0])} → ${R(v[1])} → ${R(v[2])}`,a:'Tetapkan batas anggaran untuk kategori ini',i:`Hingga ${R(v[2]-v[0])}/bulan jika kembali ke level awal`,k:'Sedang: tren dari 3 titik data',c})});
const sm=cur.filter(t=>t.a<(S.th||25000));if(sm.length>=5)R_.push({f:`${sm.length} transaksi kecil (< ${R(S.th||25000)}) total ${R(sum(sm))}`,d:`${tot?Math.round(sum(sm)/tot*100):0}% dari pengeluaran bulan ini`,a:'Tinjau apakah ada yang bisa digabung atau dikurangi',i:'Tergantung target; tidak otomatis dianggap boros',k:'Rendah: ambang bisa diubah di tab Dompet'});
cats.filter(c=>S.bud[c.k]&&c.tot>S.bud[c.k]).forEach(c=>R_.push({f:`${c.k} melebihi anggaran ${R(c.tot-S.bud[c.k])}`,d:`Realisasi ${R(c.tot)} dari anggaran ${R(S.bud[c.k])}`,a:'Naikkan anggaran atau tekan pengeluaran kategori ini',i:`Hingga ${R(c.tot-S.bud[c.k])}/bulan`,k:'Tinggi: data langsung dari anggaran',c:c.k}));
return{tot,pt,hist,cats,gm,gmp,R_,sm}}
function an(){const A=AN(M),T=(h,rows)=>`<div class="c tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows}</table></div>`;
if(!A.tot&&!A.pt)return mp()+'<div class="c" style="margin-top:10px">Belum ada data pengeluaran di bulan ini.</div>';
const top=A.cats[0],up=A.cats.filter(c=>c.pt&&c.df>0).sort((a,b)=>b.df-a.df)[0];
return mp()+`<h2>Ulasan bulanan</h2><div class="c">Pengeluaran ${M} mencapai <b>${R(A.tot)}</b>${A.pt?`, ${A.tot>=A.pt?'naik':'turun'} ${Math.abs(pc(A.tot,A.pt))}% dibanding ${pm(M)} (${R(A.pt)})`:'; belum ada data bulan sebelumnya untuk perbandingan'}. ${top?`Terbesar: ${e(top.k)} (${R(top.tot)}). `:''}${up?`Kenaikan terbesar: ${e(up.k)} +${R(up.df)}. `:''}Transaksi tertinggi: ${R(Math.max(0,...ex(M).map(t=>t.a)))}.${A.lim?'<br><small>Riwayat kurang dari 2 bulan: analisis masih terbatas.</small>':''}</div>
<h2>Rekomendasi</h2>${A.R_.map(r=>`<div class="c"><b>${e(r.f)}</b><br><small>Data:</small> ${e(r.d)}<br><small>Saran:</small> ${e(r.a)}<br><small>Estimasi dampak:</small> ${e(r.i)}<br><small>Keyakinan:</small> ${e(r.k)}<br><button class="l" onclick="go('tx',{${r.c?'c:'+JSON.stringify(r.c):'n:'+JSON.stringify(r.n)}})">Lihat transaksi →</button></div>`).join('')||`<div class="c mu">${A.lim?'Rekomendasi belum tersedia: butuh minimal 2 bulan riwayat.':'Tidak ada temuan khusus bulan ini.'}</div>`}
<h2>Kategori</h2>${T(['Kategori','Total','%','vs lalu','Trx','Rata²','Max'],A.cats.map(c=>`<tr><td><button class="l" onclick="go('tx',{c:${e(JSON.stringify(c.k))}})">${e(c.k)}</button></td><td>${R(c.tot)}</td><td>${Math.round(c.tot/A.tot*100)}%</td><td>${c.pt?pc(c.tot,c.pt)+'%':'–'}</td><td>${c.n}</td><td>${R(c.tot/c.n)}</td><td>${R(c.max)}</td></tr>`).join(''))}
${trend()}<h2>Merchant / nama transaksi</h2>${T(['Nama','Total','Trx','Rata²','vs lalu'],A.gm.slice(0,12).map(g=>{const q=A.gmp.find(x=>x.k==g.k);return `<tr><td><button class="l" onclick="go('tx',{n:${e(JSON.stringify(g.k))}})">${e(Object.keys(g.names)[0])}</button></td><td>${R(g.tot)}</td><td>${g.n}${q?' ('+q.n+')':''}</td><td>${R(g.tot/g.n)}</td><td>${q?R(g.tot-q.tot):'baru'}</td></tr>`}).join(''))}
<small>Nama dicocokkan persis (tanpa beda huruf besar/kecil). Nama mirip tidak digabung otomatis.</small>`}
function wal(){return `<h2>Dompet</h2>${S.w.map(w=>`<div class="c row"><div><b>${e(w.n)}</b><br><small>Saldo awal <input type="number" style="width:110px" value="${w.b}" onchange="S.w.find(x=>x.id==${w.id}).b=+this.value;save();V()"></small></div><b>${R(wb(w))}</b></div>`).join('')}
<div class="row"><input id="nw" placeholder="Nama dompet baru"><button class="b" onclick="if($('#nw').value.trim()){S.w.push({id:Date.now(),n:$('#nw').value.trim(),b:0});save();V()}">Tambah</button></div><small>Transfer antar-dompet tidak dihitung sebagai pemasukan/pengeluaran.</small>
<h2>Kategori</h2><div class="c">${S.c.map(c=>e(c)).join(' · ')}</div><div class="row"><input id="nc" placeholder="Kategori baru"><button class="b" onclick="if($('#nc').value.trim()){S.c.push($('#nc').value.trim());save();V()}">Tambah</button></div>

<h2>Ekspor / impor CSV</h2><div class="c"><textarea id="csv" rows="5" style="width:100%" placeholder="Tempel CSV di sini untuk impor">${e(csv())}</textarea><div class="row" style="margin-top:8px"><button class="l" onclick="$('#csv').select();document.execCommand('copy')">Salin</button><button class="b" onclick="imp()">Impor</button></div><small>Kolom: tanggal,jenis(ex/in/tf),nama,nominal,kategori,dompet,dompet_tujuan,catatan</small></div>
<h2>Akun</h2>${sb?'<button class="l" onclick="out()">Keluar</button> <small>'+e(syncMsg)+'</small>':'<small>Mode lokal (Supabase belum dikonfigurasi)</small>'}<h2>Data</h2><button class="l rd" onclick="if(!window._r){window._r=1;this.textContent='Klik lagi untuk hapus SEMUA data'}else{try{localStorage.removeItem(K)}catch(x){}location.reload()}">Hapus semua data</button><br><button class="l" onclick="demo()">Isi data contoh</button>`}
const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"',wn=id=>(S.w.find(w=>w.id==id)||{}).n||'';

saku_transactions:S.t.map(t=>({id:t.u,tx_date:t.d,name:t.n,amount:Math.round(t.a),type:t.ty,category:t.c,wallet_id:wU(t.w),wallet_to_id:t.ty=='tf'?wU(t.w2):null,note:t.note||null})),
saku_recurring:S.rc.map(r=>({id:r.u,name:r.n,amount:Math.round(r.a),category:r.c,wallet_id:wU(r.w),freq:r.fr,next_date:r.nx,end_date:r.end||null}))}}
async function push(){if(!sb||!UID)return;if(busy){again=1;return}busy=1;syncMsg='Menyimpan\u2026';
try{const RW=rows();for(const t of ORD){const k=KEY[t],cur=new Map(RW[t].map(r=>[r[k],JSON.stringify(r)])),old=H[t]||{},up=RW[t].filter(r=>old[r[k]]!==cur.get(r[k])),gone=Object.keys(old).filter(x=>!cur.has(x));
for(let i=0;i<up.length;i+=500){const{error}=await sb.from(t).upsert(up.slice(i,i+500),{onConflict:CF[t]||'id'});if(error)throw error}
for(let i=0;i<gone.length;i+=100){const{error}=await sb.from(t).delete().in(k,gone.slice(i,i+100));if(error)throw error}
H[t]=Object.fromEntries(cur)}
if(H.th!==S.th){const{error}=await sb.from('saku_settings').upsert({user_id:UID,small_tx_threshold:Math.round(S.th||25000)},{onConflict:'user_id'});if(error)throw error;H.th=S.th}
syncMsg='Tersimpan di Supabase'}catch(x){syncMsg='Gagal sinkron: '+(x.message||x);console.error(x)}
busy=0;if(again){again=0;push()}else if(tab=='wal')V()}
const all=async t=>{let o=[];for(let i=0;;i+=1000){const{data,error}=await sb.from(t).select('*').order('id').range(i,i+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o}};
async function pull(){const[w,c,t,b,r]=await Promise.all(ORD.map(all)),{data:s,error:se}=await sb.from('saku_settings').select('*').maybeSingle();if(se)throw se;
const tt=t.filter(x=>!x.deleted_at);H={};
if(!w.length&&!tt.length){await push();return}
let n=Date.now();const wm={};
S.w=w.map(x=>{const o={id:n++,u:x.id,n:x.name,b:+x.initial_balance};wm[x.id]=o.id;return o});
if(c.length)S.c=c.map(x=>x.name);
S.t=tt.map(x=>({id:n++,u:x.id,d:x.tx_date,n:x.name,a:+x.amount,ty:x.type,c:x.category||(x.type=='tf'?'Transfer':'Others'),w:wm[x.wallet_id],w2:wm[x.wallet_to_id]||null,note:x.note||''}));
S.bud={};b.forEach(x=>S.bud[x.category]=+x.amount);
S.rc=r.map(x=>({id:n++,u:x.id,n:x.name,a:+x.amount,c:x.category,w:wm[x.wallet_id],fr:x.freq,nx:x.next_date,end:x.end_date||''}));
S.th=s?+s.small_tx_threshold:25000;
const RW=rows();for(const k of ORD)H[k]=Object.fromEntries(RW[k].map(x=>[x[KEY[k]],JSON.stringify(x)]));H.th=S.th;
try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}syncMsg='Tersinkron'}
async function start(){try{await pull()}catch(x){syncMsg='Offline / gagal sinkron: '+(x.message||x)}V()}
function login(m){$('#nv').innerHTML='';$('#app').innerHTML=`<h2 style="margin-top:40px">SakuScope</h2><div class="c"><div class="f" style="grid-template-columns:1fr"><input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></div><div class="row" style="margin-top:8px"><span class="rd">${e(m||'')}</span><button class="b" onclick="doLogin()">Masuk</button></div></div>`}
async function doLogin(){const{data,error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)return login('Email atau password salah');UID=data.user.id;await start()}

sb=supabase.createClient(SB_URL,SB_KEY);let ss=null;try{ss=(await sb.auth.getSession()).data.session}catch(x){}
if(!ss)return login();UID=ss.user.id;V();await start()}
boot();
